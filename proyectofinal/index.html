    <!-- INICIO DE SESION -->
    <section id="sect-login" class="sect-auth" style="display: none;">
      
      <form id="form-login" class="form-auth">
        <h2>Iniciar sesión</h2>

        <div class="mb-3">
          <label for="login-email" class="form-label">Email</label>
          <input type="email" class="form-control" id="login-email" aria-describedby="emailHelp">
        </div>

        <div class="mb-3">
          <label for="login-password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="login-password" aria-describedby="passwordHelp">
        </div>
        
        <button type="submit" class="btn btn-primary">Iniciar sesión</button>
        <a href="#" class="btn btn-link">¿No tienes cuenta? Registrate</a>
     
      </form>      
    </section>

    <!-- REGISTRO -->
    <section id="sect-register"class="sect-auth" style="display: none;">
      
      <form id="form-register" class="form-auth">
        <h2>Registrarse</h2>

        <div class="mb-3">
          <label for="register-email" class="form-label">Email</label>
          <input type="email" class="form-control" id="register-email" aria-describedby="emailHelp">
        </div>

        <div class="mb-3">
          <label for="register-password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="register-password" aria-describedby="passwordHelp">
        </div>

        <div class="mb-3">
          <label for="register-confirm-password" class="form-label">Confirmar contraseña</label>
          <input type="password" class="form-control" id="register-confirm-password" aria-describedby="passwordHelp">
        </div>
        
        <button type="submit" class="btn btn-primary">Registrarse</button>
        <a href="#" class="btn btn-link">¿Ya tienes cuenta? Inicia sesión</a>
     
      </form>      
    </section>
